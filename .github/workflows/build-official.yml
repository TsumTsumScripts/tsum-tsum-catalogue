name: Build official.json

on:
  push:
    branches: [main, master]
    paths:
      - '**/metadata.json'
      - 'build-official.sh'
      - 'notify-discord.sh'
      - 'site/**'
      - '.github/workflows/build-official.yml'
  workflow_dispatch:

# official.json is never committed (see .gitignore) - it is generated here
# and published to GitHub Pages, next to the getting-started page in site/.
# The app reads official.json from the site root, so it stays at the root.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them, but don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build official.json
        run: bash build-official.sh

      - name: Stage site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp official.json _site/official.json

      # Snapshot what is live before this deploy replaces it, so the Discord
      # step can tell which script versions are new. The query string gets
      # past the Pages CDN cache. If it can't be fetched, the announcement
      # is skipped rather than re-announcing every script.
      - name: Fetch live official.json
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if ! curl -fsSL -o live-official.json "$BASE_URL/official.json?t=$(date +%s)"; then
            rm -f live-official.json
            echo "::warning::Could not fetch the live official.json; the Discord announcement will be skipped."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Announce on Discord
        if: hashFiles('live-official.json') != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash notify-discord.sh live-official.json official.json "${{ steps.deployment.outputs.page_url }}"
