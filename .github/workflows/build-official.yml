name: Build official.json

on:
  push:
    branches: [main, master]
    paths:
      - '**/metadata.json'
      - 'build-official.sh'
      - '.github/workflows/build-official.yml'
  workflow_dispatch:

# official.json is never committed (see .gitignore) - it is generated here
# and published to GitHub Pages instead.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them, but don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build official.json
        run: bash build-official.sh

      - name: Stage site
        run: |
          mkdir -p _site
          cp official.json _site/official.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
