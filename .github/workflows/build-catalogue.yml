name: Build catalogue.json

on:
  push:
    branches: [main]
    paths:
      - '**/metadata.json'
      - 'build-catalogue.sh'
      - 'notify-discord.sh'
      - '.github/workflows/build-catalogue.yml'
  workflow_dispatch:

# catalogue.json is never committed (see .gitignore) - it is generated here
# and published to GitHub Pages. The GAP app lists it as a built-in library
# source at https://tsumtsumscripts.github.io/tsum-tsum-catalogue/catalogue.json,
# so its path must not change.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them, but don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build catalogue.json
        run: bash build-catalogue.sh

      - name: Stage site
        run: |
          mkdir -p _site
          cp catalogue.json _site/catalogue.json

      # Snapshot what is live before this deploy replaces it, so the Discord
      # step can tell which script versions are new. The query string gets
      # past the Pages CDN cache. If it can't be fetched, the announcement
      # is skipped rather than re-announcing every script.
      - name: Fetch live catalogue.json
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if ! curl -fsSL -o live-catalogue.json "$BASE_URL/catalogue.json?t=$(date +%s)"; then
            rm -f live-catalogue.json
            echo "::warning::Could not fetch the live catalogue.json; the Discord announcement will be skipped."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Announce on Discord
        if: hashFiles('live-catalogue.json') != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash notify-discord.sh live-catalogue.json catalogue.json "${{ steps.deployment.outputs.page_url }}"
